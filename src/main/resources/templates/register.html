<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Register</title>
</head>
<body>

<section>
    <section class="text-gray-600 body-font">
        <form id="registerForm" onsubmit="return saveUser(event)" class="form" method="post" enctype="multipart/form-data">
            <div class="container px-5 py-5 mx-auto flex flex-wrap items-center">

                <div class="lg:w-2/5 md:w-1/2 md:pr-16 lg:pr-0 pr-0">
                    <img src="img/ecom.png" class="d-block w-100" alt="...">
                </div>

                <div class="lg:w-3/6 md:w-1/2 bg-gray-100 rounded-lg p-8 flex flex-col md:ml-auto w-full md:mt-0">
                    <h2 class="text-gray-900 text-lg font-medium title-font mb-5 text-center shadow p-3 bg-body-tertiary rounded">Register</h2>

                    <div th:if="${session.userMessage}" class="container">
                        <div th:classappend="' text-' + ${session.userMessage.type}"
                             class="alert text-center" role="alert">
                            <p th:text="${session.userMessage.content}"></p>
                        </div>
                        <th:block th:text="${@sessionHelperImpl.removeSessionAttribute('userMessage')}"></th:block>
                    </div>


                    <!-- Full Name & Mobile -->
                    <div class="flex gap-4 mb-2">
                        <div class="w-1/2">
                            <label for="username" class="leading-7 text-sm text-gray-600">Full Name</label>
                            <input type="text" id="username" name="username"
                                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 input-field">
                            <p class="text-red-500 text-sm mt-1"></p>
                        </div>
                        <div class="w-1/2">
                            <label for="mobileNumber" class="leading-7 text-sm text-gray-600">Mobile Number</label>
                            <input type="number" id="mobileNumber" name="mobileNumber"
                                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 input-field">
                            <p class="text-red-500 text-sm mt-1"></p>
                        </div>
                    </div>


                    <!-- Email -->
                    <div class="mb-2">
                        <label for="email" class="leading-7 text-sm text-gray-600">Email</label>
                        <input type="email" id="email" name="email"
                               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 input-field">
                        <p class="text-red-500 text-sm mt-1"></p>
                    </div>

                    <!-- Address -->
                    <div class="mb-2">
                        <label for="address" class="leading-7 text-sm text-gray-600">Address</label>
                        <input type="text" id="address" name="address"
                               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 input-field">
                        <p class="text-red-500 text-sm mt-1"></p>
                    </div>


                    <!-- Country & State -->
                    <div class="flex gap-4 mb-2">
                        <div class="w-1/2">
                            <label for="country" class="leading-7 text-sm text-gray-600">Country</label>
                            <select id="country" name="country" onchange="loadStates(this.value)" class="w-full border border-gray-300 rounded px-3 py-2 input-field">
                                <option value="">Select Country</option>
                            </select>
                            <p class="text-red-500 text-sm mt-1"></p>
                        </div>
                        <div class="w-1/2">
                            <label for="state" class="leading-7 text-sm text-gray-600">State</label>
                            <select id="state" name="state" onchange="loadCities(country.value, this.value)" class="w-full border border-gray-300 rounded px-3 py-2 input-field">
                                <option value="">Select State</option>
                            </select>
                            <p class="text-red-500 text-sm mt-1"></p>
                        </div>
                    </div>

                    <!-- City & Pincode -->
                    <div class="flex gap-4 mb-2">
                        <div class="w-1/2">
                            <label for="city" class="leading-7 text-sm text-gray-600">City</label>
                            <select id="city" name="city" class="w-full border border-gray-300 rounded px-3 py-2 input-field">
                                <option value="">Select City</option>
                            </select>
                            <p class="text-red-500 text-sm mt-1"></p>
                        </div>
                        <div class="w-1/2">
                            <label for="pincode" class="leading-7 text-sm text-gray-600">Pincode</label>
                            <input type="text" id="pincode" name="pincode"
                                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 input-field">
                            <p class="text-red-500 text-sm mt-1"></p>
                        </div>
                    </div>

                    <!-- Password & Confirm -->
                    <div class="flex gap-4 mb-2">
                        <!-- Password -->
                        <div class="w-1/2 relative">
                            <label for="password" class="leading-7 text-sm text-gray-600">Password</label>
                            <input type="password" id="password" name="password"
                                   class="w-full border border-gray-300 rounded px-3 py-2 pr-10 input-field">
                            <!-- Eye icon -->
                            <button type="button" class="absolute right-3 top-9 text-gray-500" onclick="togglePassword('password', this)">
                                <!-- Eye open -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                     stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                            <p class="text-red-500 text-sm mt-1"></p>
                        </div>

                        <!-- Confirm Password -->
                        <div class="w-1/2 relative">
                            <label for="confirmPassword" class="leading-7 text-sm text-gray-600">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   class="w-full border border-gray-300 rounded px-3 py-2 pr-10 input-field">
                            <!-- Eye icon -->
                            <button type="button" class="absolute right-3 top-9 text-gray-500" onclick="togglePassword('confirmPassword', this)">
                                <!-- Eye open -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                     stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                            <p class="text-red-500 text-sm mt-1"></p>
                        </div>
                    </div>


                    <!-- Profile Image -->
                    <div class="mb-3 mt-3">
                        <label class="form-label leading-7 text-sm text-gray-600">Profile Image</label>
                        <input class="w-full border border-gray-300 rounded px-3 py-2" name="profile_img" type="file" />
                    </div>

                    <!-- Submit -->
                    <button type="submit"
                            class="text-white bg-indigo-500 border-0 py-2 px-8 focus:outline-none hover:bg-indigo-600 rounded text-lg mt-3">
                        Register
                    </button>

                    <div class="container relative mb-3 text-center">
                        <br> Have an account? <a th:href="@{/signin}" class="text-blue-400">Login</a>
                    </div>
                </div>

            </div>
        </form>
    </section>

</section>

</body>
</html>
