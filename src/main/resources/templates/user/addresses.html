<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base::layout(~{::section})">

<section>
    <main class="main">

        <!-- Page Title -->
        <div class="page-title light-background">
            <div class="container d-lg-flex justify-content-between align-items-center">
                <h1 class="mb-2 mb-lg-0">Account</h1>
                <nav class="breadcrumbs">
                    <ol>
                        <li><a href="index.html">Home</a></li>
                        <li class="current">Account</li>
                    </ol>
                </nav>
            </div>
        </div><!-- End Page Title -->

        <!-- Account Section -->
        <section id="account" class="account section">

            <div class="container">

                <!-- Mobile Menu Toggle -->
                <div class="mobile-menu d-lg-none mb-4">
                    <button class="mobile-menu-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#profileMenu">
                        <i class="bi bi-grid"></i>
                        <span>Menu</span>
                    </button>
                </div>

                <div class="row g-4">
                    <!-- Profile Menu -->
                    <div class="col-lg-3">
                        <div th:replace="user/fragments/sidebar :: sidebar"></div>
                    </div>

                    <!-- Content Area -->
                    <div class="col-lg-9">
                        <div class="content-area">
                            <div class="tab-content">


                                <!-- Addresses Tab -->
                                <div class="tab-pane fade show active" id="addresses">
                                    <div class="section-header">
                                        <h2>My Addresses</h2>
                                        <div class="header-actions">
                                            <button type="button" class="btn-add-new" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                                                <i class="bi bi-plus-lg"></i>
                                                Add New Address
                                            </button>
                                        </div>

                                        <!-- Add Address Modal -->
                                        <div class="modal fade" id="addAddressModal" tabindex="-1" aria-labelledby="addAddressModalLabel" aria-hidden="true">
                                            <div class="modal-dialog modal-lg modal-dialog-centered">
                                                <div class="modal-content">

                                                    <!-- Modal Header -->
                                                    <div class="modal-header">
                                                        <h5 class="modal-title" id="addAddressModalLabel">Add New Address</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                    </div>

                                                    <!-- Modal Body -->
                                                    <div class="modal-body">
                                                        <form id="addressForm">
                                                            <div class="row g-3">
                                                                <!-- Address Title -->
                                                                <div class="col-md-6">
                                                                    <label class="form-label">Address Title</label>
                                                                    <input type="text" name="title" class="form-control" placeholder="Home / Office" required>
                                                                </div>

                                                                <!-- Full Name -->
                                                                <div class="col-md-6">
                                                                    <label class="form-label">Full Name</label>
                                                                    <input type="text" name="fullName" class="form-control" required>
                                                                </div>

                                                                <!-- Phone -->
                                                                <div class="col-md-6">
                                                                    <label class="form-label">Phone</label>
                                                                    <input type="text" name="phone" class="form-control" required>
                                                                </div>

                                                                <!-- Street -->
                                                                <div class="col-md-6">
                                                                    <label class="form-label">Street</label>
                                                                    <input type="text" name="street" class="form-control" required>
                                                                </div>

                                                                <!-- City -->
                                                                <div class="col-md-6">
                                                                    <label class="form-label">City</label>
                                                                    <input type="text" name="city" class="form-control" required>
                                                                </div>

                                                                <!-- State -->
                                                                <div class="col-md-6">
                                                                    <label class="form-label">State</label>
                                                                    <input type="text" name="state" class="form-control" required>
                                                                </div>

                                                                <!-- Zip Code -->
                                                                <div class="col-md-6">
                                                                    <label class="form-label">Zip Code</label>
                                                                    <input type="text" name="zip" class="form-control" required>
                                                                </div>

                                                                <!-- Country -->
                                                                <div class="col-md-6">
                                                                    <label class="form-label">Country</label>
                                                                    <input type="text" name="country" class="form-control" required>
                                                                </div>
                                                            </div>

                                                            <!-- Default Address Checkbox -->
                                                            <div class="form-check mt-3">
                                                                <input class="form-check-input" type="checkbox" name="isDefault" id="isDefault">
                                                                <label class="form-check-label" for="isDefault">Make this my default address</label>
                                                            </div>
                                                        </form>
                                                    </div>

                                                    <!-- Modal Footer -->
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                                        <button type="submit" class="btn btn-primary" onclick="saveAddress()">Save Address</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>



                                    </div>





                                    <div class="addresses-grid">
                                        <!-- Address Card 1 -->
                                        <div th:id="'address-card-' + ${address.id}" class="address-card" th:each="address : ${addresses}"
                                             th:classappend="${address.isDefault} ? ' default' : ''">
                                            <div class="card-header">
                                                <h4 th:text="${address.title}">Home</h4>
                                                <span th:if="${address.isDefault}" class="default-badge">Default</span>
                                            </div>
                                            <div class="card-body">
                                                <p class="address-text">
                                                    <span th:text="${address.street}"></span><br>
                                                    <span th:text="${address.city}"></span>,
                                                    <span th:text="${address.state}"></span>
                                                    <span th:text="${address.zip}"></span><br>
                                                    <span th:text="${address.country}"></span>
                                                </p>
                                                <div class="contact-info">
                                                    <div><i class="bi bi-person" ></i> <span th:text="${address.fullName}"></span></div>
                                                    <div><i class="bi bi-telephone"></i> <span th:text="${address.phone}"></span></div>
                                                </div>
                                            </div>
                                            <div class="card-actions">
                                                <button type="button" class="btn-edit" data-bs-toggle="modal"
                                                        th:attr="data-bs-target='#editAddressModal-' + ${address.id}">
                                                    <i class="bi bi-pencil"></i>
                                                    Edit
                                                </button>
                                                <button  type="button" class="btn-remove" th:onclick="'removeAddress(' + ${address.id} + ')'">
                                                    <i class="bi bi-trash"></i>
                                                    Remove
                                                </button>
                                                <button th:if="${!address.isDefault}" type="button" class="btn-make-default"
                                                        th:onclick="'makeDefault(' + ${address.id} + ')'">
                                                    Make Default
                                                </button>
                                            </div>

                                            <!-- Edit Modal (unique per address) -->
                                            <div class="modal fade"
                                                 th:id="'editAddressModal-' + ${address.id}"
                                                 tabindex="-1"
                                                 aria-hidden="true">
                                                <div class="modal-dialog modal-lg modal-dialog-centered">
                                                    <div class="modal-content">

                                                        <div class="modal-header">
                                                            <h5 class="modal-title">Edit Address</h5>
                                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                        </div>

                                                        <div class="modal-body">
                                                            <form th:id="'editAddressForm-' + ${address.id}">
                                                                <input type="hidden" name="id" th:value="${address.id}">
                                                                <div class="row g-3">
                                                                    <div class="col-md-6">
                                                                        <label class="form-label">Title</label>
                                                                        <input type="text" name="title" class="form-control" th:value="${address.title}">
                                                                    </div>
                                                                    <div class="col-md-6">
                                                                        <label class="form-label">Full Name</label>
                                                                        <input type="text" name="fullName" class="form-control" th:value="${address.fullName}">
                                                                    </div>
                                                                    <div class="col-md-6">
                                                                        <label class="form-label">Phone</label>
                                                                        <input type="text" name="phone" class="form-control" th:value="${address.phone}">
                                                                    </div>
                                                                    <div class="col-md-6">
                                                                        <label class="form-label">Street</label>
                                                                        <input type="text" name="street" class="form-control" th:value="${address.street}">
                                                                    </div>
                                                                    <div class="col-md-6">
                                                                        <label class="form-label">City</label>
                                                                        <input type="text" name="city" class="form-control" th:value="${address.city}">
                                                                    </div>
                                                                    <div class="col-md-6">
                                                                        <label class="form-label">State</label>
                                                                        <input type="text" name="state" class="form-control" th:value="${address.state}">
                                                                    </div>
                                                                    <div class="col-md-6">
                                                                        <label class="form-label">Zip</label>
                                                                        <input type="text" name="zip" class="form-control" th:value="${address.zip}">
                                                                    </div>
                                                                    <div class="col-md-6">
                                                                        <label class="form-label">Country</label>
                                                                        <input type="text" name="country" class="form-control" th:value="${address.country}">
                                                                    </div>
                                                                </div>
                                                                <div class="form-check mt-3">
                                                                    <input class="form-check-input" type="checkbox" name="isDefault" th:checked="${address.isDefault}">
                                                                    <label class="form-check-label">Make this my default address</label>
                                                                </div>
                                                            </form>
                                                        </div>

                                                        <div class="modal-footer">
                                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                                            <button type="button" class="btn btn-primary" th:onclick="'updateAddress(' + ${address.id} + ')'">Save Changes</button>
                                                        </div>

                                                    </div>
                                                </div>
                                            </div>


                                        </div>



                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </section><!-- /Account Section -->

    </main>

</section>

</html>
