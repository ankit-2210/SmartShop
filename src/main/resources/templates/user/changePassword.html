<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
</head>
<body>
<section>
    <div class="container-fluid mb-5" style="margin-top: 40px;">
        <div class="row">

            <!-- Sidebar -->
            <nav class="col-sm-3 col-md-3 col-lg-2 bg-white shadow-sm sidebar d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
                <!-- Profile Section -->
                <div class="text-center mb-4">
                    <img src="" alt="Student"
                         class="img-thumbnail rounded-circle border-0 shadow-sm"
                         style="width:120px; height:120px; object-fit:cover;">
                    <h6 class="mt-2 fw-bold">Ankit</h6>
                </div>

                <!-- Navigation -->
                <ul class="nav flex-column w-100 px-3">
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" th:href="@{/user/profile}">
                            <i class="fas fa-user me-2"></i> Profile
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" th:href="@{/user/myorders}">
                            <i class="fas fa-book me-2"></i> My Courses
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" th:href="@{/user/feedback}">
                            <i class="fas fa-comment-dots me-2"></i> Feedback
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" th:href="@{/user/changePassword}">
                            <i class="fas fa-key me-2"></i> Change Password
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" th:href="@{/logout}">
                            <i class="fas fa-sign-out-alt me-2"></i> Logout
                        </a>
                    </li>
                </ul>

                <!-- Home Button -->
                <div class="mt-auto mb-4 w-100 px-3">
                    <a th:href="@{/' }" class="btn btn-success w-100 rounded-pill">
                        <i class="fas fa-home me-2"></i> Home
                    </a>
                </div>
            </nav>

            <!--    <section class="text-gray-600 body-font relative">-->
            <div class="col-sm-9">
                <div class="card p-4">
                    <h1 class="sm:text-3xl text-2xl font-medium title-font mb-4 text-gray-900 mx-auto">Change
                        Password</h1>

                    <div th:if="${session.changePasswordMessage}" class="container">
                        <div th:classappend="' text-' + ${session.changePasswordMessage.type}"
                             class="alert text-center" role="alert">
                            <p th:text="${session.changePasswordMessage.content}"></p>
                        </div>
                        <th:block
                                th:text="${@sessionHelperImpl.removeSessionAttribute('changePasswordMessage')}"></th:block>
                    </div>

                    <form th:action="@{/user/change-password}" method="post" enctype="multipart/form-data">
                        <div class="lg:w-1/2 md:w-2/3 mx-auto">
                            <div class="flex flex-wrap -m-2">
                                <div class="p-2 w-full">
                                    <div class="relative">
                                        <label for="currPassword"
                                               class="leading-7 text-sm text-gray-600 font-bold ml-2">Current
                                            Password</label>
                                        <input type="text" id="currPassword" name="currPassword"
                                               class="w-full bg-gray-100 bg-opacity-50 rounded border border-gray-300 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
                                    </div>
                                </div>
                                <div class="p-2 w-full">
                                    <div class="relative">
                                        <label for="newPassword" class="leading-7 text-sm text-gray-600 font-bold ml-2">New
                                            Password</label>
                                        <input type="text" id="newPassword" name="newPassword"
                                               class="w-full bg-gray-100 bg-opacity-50 rounded border border-gray-300 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
                                    </div>
                                </div>
                                <div class="p-2 w-full">
                                    <div class="relative">
                                        <label for="confirmPassword"
                                               class="leading-7 text-sm text-gray-600 font-bold ml-2">Confirm
                                            Password</label>
                                        <input type="text" id="confirmPassword" name="confirmPassword"
                                               class="w-full bg-gray-100 bg-opacity-50 rounded border border-gray-300 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
                                    </div>
                                </div>
                                <div class="p-2 w-full">
                                    <button class="flex mx-auto text-white bg-indigo-500 border-0 py-2 px-8 focus:outline-none hover:bg-indigo-600 rounded text-lg">
                                        Change
                                    </button>
                                </div>

                            </div>
                        </div>

                    </form>

                </div>
            </div>
            <!--    </section>-->


        </div>

    </div>


</section>
</body>
</html>
