<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Product</title>
</head>
<body>


<section>

    <main class="main">

        <!-- Page Title -->
        <div class="page-title light-background">
            <div class="container d-lg-flex justify-content-between align-items-center">
                <h1 class="mb-2 mb-lg-0">All Category</h1>
                <nav class="breadcrumbs">
                    <ol>
                        <li><a th:href="@{/}">Home</a></li>
                        <li class="current">Category</li>
                    </ol>
                </nav>
            </div>
        </div><!-- End Page Title -->

        <div class="container">
            <div class="row">

                <div class="col-lg-4 sidebar">
                    <div class="widgets-container">

                        <!-- Product Categories Widget -->
                        <div class="product-categories-widget widget-item">
                            <h3 class="widget-title">Categories</h3>
                            <ul class="category-tree list-unstyled mb-0">
                                <!-- Clothing Category -->
                                <li class="category-item" th:each="cat, iterStat : ${Categories}">
                                    <!-- Toggle -->
                                    <div class="d-flex justify-content-between align-items-center category-header collapsed"
                                         data-bs-toggle="collapse"
                                         th:attr="data-bs-target='#subcategories-' + ${iterStat.index}"
                                         aria-expanded="false"
                                         th:attrappend="aria-controls='subcategories-' + ${iterStat.index}">

                                        <a href="javascript:void(0)" class="category-link" th:text="${cat.categoryName}"></a>
                                        <span class="category-toggle">
                                            <i class="bi bi-chevron-down"></i>
                                            <i class="bi bi-chevron-up"></i>
                                        </span>
                                    </div>

                                    <!-- Collapse target -->
                                    <ul th:id="'subcategories-' + ${iterStat.index}" class="subcategory-list list-unstyled collapse ps-3 mt-2">
                                        <li th:each="sub : ${cat.subCategories}">
                                            <a th:href="@{/products(category=${cat.categoryName}, subcategory=${sub.subcategoryName})}"
                                               class="subcategory-link" th:text="${sub.subcategoryName}">
                                            </a>
                                        </li>
                                    </ul>
                                </li>
                            </ul>
                        </div><!--/Product Categories Widget -->



                        <!-- Pricing Range Widget -->
                        <div class="pricing-range-widget widget-item">

                            <h3 class="widget-title">Price Range</h3>

                            <div class="price-range-container">
                                <div class="current-range mb-3">
                                    <span class="min-price">$0</span>
                                    <span class="max-price float-end">$1000</span>
                                </div>

                                <div class="range-slider">
                                    <div class="slider-track"></div>
                                    <div class="slider-progress"></div>
                                    <input type="range" class="min-range" min="0" max="1000" value="0" step="10">
                                    <input type="range" class="max-range" min="0" max="1000" value="500" step="10">
                                </div>

                                <div class="price-inputs mt-3">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <div class="input-group input-group-sm">
                                                <span class="input-group-text">$</span>
                                                <input type="number" class="form-control min-price-input" placeholder="Min" min="0" max="1000" value="0" step="10">
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="input-group input-group-sm">
                                                <span class="input-group-text">$</span>
                                                <input type="number" class="form-control max-price-input" placeholder="Max" min="0" max="1000" value="500" step="10">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="filter-actions mt-3">
                                    <button type="button" class="btn btn-sm btn-primary w-100">Apply Filter</button>
                                </div>
                            </div>

                        </div><!--/Pricing Range Widget -->

                        <!-- Brand Filter Widget -->
                        <h3 class="brand-filter-widget widget-item">Filter by Brand</h3><!--/Brand Filter Widget -->

                        <!-- Color Filter Widget -->
                        <div class="color-filter-widget widget-item">
                            <h3 class="widget-title">Filter by Color</h3>
                            <div class="color-filter-content">
                                <div class="color-options">
                                    <div class="form-check color-option" th:each="clr : ${colors}">
                                        <input class="form-check-input" type="checkbox"
                                               th:value="${clr.name()}"
                                               th:id="'color-' + ${clr.name().toLowerCase()}">
                                        <label class="form-check-label" th:for="'color-' + ${clr.name().toLowerCase()}">
                                            <span class="color-swatch" th:style="'background-color:' + ${clr.hexCode}" th:title="${clr.name()}"></span>
                                        </label>
                                    </div>
                                </div>

                                <div class="filter-actions mt-3">
                                    <button type="button" class="btn btn-sm btn-outline-secondary">Clear All</button>
                                    <button type="button" class="btn btn-sm btn-primary">Apply Filter</button>
                                </div>
                            </div>
                        </div><!--/Color Filter Widget -->


                        <!-- Brand Filter Widget -->
                        <div class="brand-filter-widget widget-item">

                            <h3 class="widget-title">Filter by Brand</h3>

                            <div class="brand-filter-content">
                                <div class="brand-search">
                                    <input type="text" class="form-control" placeholder="Search brands...">
                                    <i class="bi bi-search"></i>
                                </div>

                                <div class="brand-list">
                                    <div class="brand-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="brand1">
                                            <label class="form-check-label" for="brand1">
                                                Nike
                                                <span class="brand-count">(24)</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="brand-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="brand2">
                                            <label class="form-check-label" for="brand2">
                                                Adidas
                                                <span class="brand-count">(18)</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="brand-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="brand3">
                                            <label class="form-check-label" for="brand3">
                                                Puma
                                                <span class="brand-count">(12)</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="brand-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="brand4">
                                            <label class="form-check-label" for="brand4">
                                                Reebok
                                                <span class="brand-count">(9)</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="brand-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="brand5">
                                            <label class="form-check-label" for="brand5">
                                                Under Armour
                                                <span class="brand-count">(7)</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="brand-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="brand6">
                                            <label class="form-check-label" for="brand6">
                                                New Balance
                                                <span class="brand-count">(6)</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="brand-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="brand7">
                                            <label class="form-check-label" for="brand7">
                                                Converse
                                                <span class="brand-count">(5)</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="brand-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="brand8">
                                            <label class="form-check-label" for="brand8">
                                                Vans
                                                <span class="brand-count">(4)</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div class="brand-actions">
                                    <button class="btn btn-sm btn-outline-primary">Apply Filter</button>
                                    <button class="btn btn-sm btn-link">Clear All</button>
                                </div>
                            </div>

                        </div><!--/Brand Filter Widget -->

                    </div>

                </div>

                <div class="col-lg-8">

                    <!-- Category Header Section -->
                    <section id="category-header" class="category-header section" th:if="${!#lists.isEmpty(Products)}">

                        <div class="container">

                            <!-- Filter and Sort Options -->
                            <div class="filter-container mb-4" >
                                <div class="row g-3">

                                    <div class="col-12 col-md-6 col-lg-4">
                                        <form action="/search" method="get">
                                        <div class="filter-item search-form">
                                            <label for="productSearch" class="form-label">Search Products</label>
                                            <div class="input-group">
                                                <input type="text" name="keyword"
                                                       class="form-control"
                                                       id="productSearch"
                                                       placeholder="Search for products..."
                                                       th:value="${keyword}" />
                                                <button class="btn search-btn" type="submit">
                                                    <i class="bi bi-search"></i>
                                                </button>
                                            </div>
                                        </div>
                                        </form>

                                    </div>

                                    <div class="col-12 col-md-6 col-lg-2">
                                        <div class="filter-item">
                                            <label for="priceRange" class="form-label">Price Range</label>
                                            <select class="form-select" id="priceRange">
                                                <option selected="">All Prices</option>
                                                <option>Under $25</option>
                                                <option>$25 to $50</option>
                                                <option>$50 to $100</option>
                                                <option>$100 to $200</option>
                                                <option>$200 &amp; Above</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-6 col-lg-2">
                                        <div class="filter-item">
                                            <label for="sortBy" class="form-label">Sort By</label>
                                            <select class="form-select" id="sortBy">
                                                <option selected="">Featured</option>
                                                <option>Price: Low to High</option>
                                                <option>Price: High to Low</option>
                                                <option>Customer Rating</option>
                                                <option>Newest Arrivals</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-6 col-lg-4">
                                        <div class="filter-item">
                                            <label class="form-label">View</label>
                                            <div class="d-flex align-items-center">
                                                <div class="view-options me-3">
                                                    <button type="button" class="btn view-btn active" data-view="grid" aria-label="Grid view">
                                                        <i class="bi bi-grid-3x3-gap-fill"></i>
                                                    </button>
                                                    <button type="button" class="btn view-btn" data-view="list" aria-label="List view">
                                                        <i class="bi bi-list-ul"></i>
                                                    </button>
                                                </div>
                                                <div class="items-per-page">
                                                    <select class="form-select" id="itemsPerPage" aria-label="Items per page">
                                                        <option value="12">12 per page</option>
                                                        <option value="24">24 per page</option>
                                                        <option value="48">48 per page</option>
                                                        <option value="96">96 per page</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </section>

                    <!-- Category Product List Section -->
                    <section id="category-product-list" class="category-product-list section">
                        <div class="container" >
                            <div class="row g-4">

                                <!-- Show message if no products -->
                                <div th:if="${#lists.isEmpty(Products)}" class="col-12">
                                    <div class="card text-center border-danger shadow-sm">
                                        <div class="card-body">
                                            <h4 class="text-danger">
                                                <i class="bi bi-x-circle me-2"></i>
                                                Product does not exist
                                            </h4>
                                        </div>
                                    </div>
                                </div>

                                <!-- Product 1 -->
                                <div th:each="p : ${Products}" class="col-6 col-xl-4">
                                    <div class="product-card" >
                                        <div class="product-image">
                                            <img th:src="@{'/img/product_img/'+${p.image}}" class="main-image img-fluid" alt="Product" />
                                            <img th:src="@{'/img/product_img/product-f-2.webp'}" class="hover-image img-fluid" alt="Product Variant" />
                                            <div class="product-overlay">
                                                <div class="product-actions">
                                                    <button th:onclick="'window.location.href=\'/product/' + ${p.id} + '\''" type="button" class="action-btn" data-bs-toggle="tooltip" title="Quick View">

                                                        <i class="bi bi-eye"></i>
                                                    </button>
                                                    <button type="button" class="action-btn" data-bs-toggle="tooltip" title="Add to Cart"
                                                            th:attr="data-stock=${p.stock}, data-loggedIn=${User != null}, data-productId=${p.id}, data-userId=${User?.id}"
                                                            onclick="handleAddToCart(this)">
                                                        <i class="bi bi-cart-plus"></i></a>
                                                    </button>
                                                </div>
                                            </div>
                                            <div class="product-badge sale" th:text="${p.discount}+'%'" th:if="${p.discount>0}"></div>
                                        </div>
                                        <div class="product-details">
                                            <div class="product-category" th:text="${p.name}"></div>
                                            <h4 class="product-title"><a href="product-details.html" th:text="${p.title}">Tempor Incididunt</a></h4>

                                            <!-- Price -->
                                            <div class="product-price mb-2">
                                                <span class="text-decoration-line-through text-muted me-2"
                                                      th:text="'₹ ' + ${p.price}"></span>
                                                <span class="fw-bold text-dark fs-5"
                                                      th:if="${p.discount > 0}" th:text="'₹ '+${p.discountPrice}"></span>
                                            </div>

                                            <!-- Rating -->
                                            <div class="product-rating mb-2">
                                                <i class="bi bi-star-fill text-warning"></i>
                                                <span class="fw-bold" >4.0</span>
                                                <span class="text-muted small">(42)</span>
                                            </div>

                                            <!-- Color Swatches -->
                                            <div class="color-swatches mt-2">
                                                <span th:each="clr : ${p.colors}" class="swatch rounded-circle me-2 border"
                                                        th:style="'background-color:' + ${clr.hexCode} + '; width:20px; height:20px; display:inline-block;'">
                                                </span>
                                            </div>
                                        </div>

                                    </div>
                                </div>




                            </div>

                        </div>

                    </section><!-- /Category Product List Section -->

                    <!-- Category Pagination Section -->
                    <section id="category-pagination" class="category-pagination section" th:if="${!#lists.isEmpty(Products)}">

                        <div class="container">
                            <nav class="d-flex justify-content-center" aria-label="Page navigation">
                                <ul class="pagination">
                                    <li class="page-item" th:classappend="${isFirst}?'disabled':''">
                                        <a class="page-link" th:href="@{'/products?pageNo='+${pageNo-1}}">Previous</a>
                                    </li>
                                    <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                                        class="page-item" th:classappend="${pageNo+1==i}?'active':''">
                                        <a class="page-link" th:href="@{'/products?pageNo='+${i-1}}"><span th:text="${i}"></span></a></li>
                                    <li class="page-item" th:classappend="${isLast}?'disabled':''">
                                        <a class="page-link" th:href="@{'/products?pageNo='+${pageNo+1}}">Next</a>
                                    </li>
                                </ul>

                            </nav>
                        </div>

                    </section><!-- /Category Pagination Section -->






                </div>
            </div>

        </div>
    </main>



</section>

</body>
</html>
