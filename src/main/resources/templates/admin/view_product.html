<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
</head>
<body>

<section>
    <div class="container-fluid p-5 mt-5 ">
        <div class="d-flex justify-content-center align-items-center" >
            <div class="col-md-12">
                <div class="card card-sh p-4">

                    <div class="position-relative mb-4 card-header">
                        <h3 class="text-center m-0">View Products</h3>
                    </div>

                    <form class="d-flex justify-content-between align-items-center mt-3">
                        <div class="row w-100">
                            <div class="col-4 ms-3">
                                <input type="text" class="form-control" placeholder="Search..." />
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-primary">Search</button>
                            </div>
                        </div>
                        <a th:href="@{'/admin/'}" class="btn btn-secondary me-4">Back</a>
                    </form>

                    <div th:if="${session.tableMessage}" class="container">
                        <div th:classappend="' text-' + ${session.tableMessage.type}"
                             class="alert text-center" role="alert">
                            <p th:text="${session.tableMessage.content}"></p>
                        </div>
                        <th:block th:text="${@sessionHelperImpl.removeSessionAttribute('tableMessage')}"></th:block>
                    </div>


                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th class="text-center" scope="col">SL No.</th>
                                    <th class="text-center" scope="col">Image</th>
                                    <th class="text-center" scope="col">Name</th>
                                    <th class="text-center" scope="col">Category</th>
                                    <th class="text-center" scope="col">SubCategory</th>
                                    <th class="text-center" scope="col">Status</th>
                                    <th class="text-center" scope="col">Price</th>
                                    <th class="text-center" scope="col">Discount</th>
                                    <th class="text-center" scope="col">Discount Price</th>
                                    <th class="text-center" scope="col">Stock</th>
                                    <th class="text-center" scope="col">Action</th>
                                </tr>
                            </thead>
                        <tbody>
                            <tr th:each="p, prod : ${products}" th:id="'productRow_' + ${p.id}">
                                <th class="text-center" scope="row" th:text="${prod.index + 1}"></th>
                                <td class="text-center">
                                    <img class="rounded-circle text-center mx-auto" width="70px" height="50px"
                                        th:src="@{'/img/product_img/' + ${p.image}}"/>
                                </td>
                                <td class="text-center" th:text="${p.name}"></td>
                                <td class="text-center" th:text="${p.category}"></td>
                                <td class="text-center" th:text="${p.subcategory}"></td>

                                <!-- Status -->
                                <td class="text-center" th:text="${p.isActive} ? 'Active' : 'Not Active'"
                                    th:classappend="${p.isActive} ? 'text-success' : 'text-danger'">
                                </td>

                                <!-- Prices -->
                                <td class="text-center" th:text="${p.price} + ' Rs.'"></td>
                                <td class="text-center" th:text="${p.discount} + '%'"></td>
                                <td class="text-center" th:text="${p.discountPrice} + ' Rs.'"></td>
                                <td class="text-center" th:text="${p.stock}"></td>

                                <!-- Action -->
                                <td class="text-center">
                                    <button type="button" class="btn btn-primary btn-sm"
                                            data-bs-toggle="modal" th:attr="data-bs-target='#editProductModal__' + ${p.id}">
                                        <i class="fa-solid fa-pen-to-square fa-1x"></i> Edit
                                    </button>
                                    <button type="button" class="btn btn-danger btn-sm"
                                            th:onclick="'deleteProduct(' + ${p.id} + ')'">
                                        <i class="fa-solid fa-trash fa-1x"></i> Delete
                                    </button>
                                </td>

                                <!-- Modal -->
                                <div class="modal fade" th:id="'editProductModal__' + ${p.id}" tabindex="-1">
                                    <div class="modal-dialog modal-lg">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Edit Product</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                                <form method="post" enctype="multipart/form-data">
                                                    <input type="hidden" name="id" th:value="${p.id}"/>

                                                    <div class="mb-3">
                                                        <label class="form-label">Product Name</label>
                                                        <input type="text" class="form-control" name="name" th:value="${p.name}" required/>
                                                    </div>

                                                    <div class="mb-3">
                                                        <label class="form-label">Product Title</label>
                                                        <input type="text" class="form-control" name="title" th:value="${p.title}" required/>
                                                    </div>

                                                    <div class="mb-3">
                                                        <label class="form-label">Category</label>
                                                        <input type="text" class="form-control" name="category" th:value="${p.category}" readonly/>
                                                    </div>

                                                    <div class="mb-3">
                                                        <label class="form-label">Subcategory</label>
                                                        <input type="text" class="form-control" name="subcategory" th:value="${p.subcategory}" readonly/>
                                                    </div>

                                                    <div class="mb-3">
                                                        <label class="form-label">Price</label>
                                                        <input type="number" class="form-control" name="price" th:value="${p.price}" required/>
                                                    </div>

                                                    <div class="mb-3">
                                                        <label class="form-label">Discount (%)</label>
                                                        <input type="number" class="form-control" name="discount" th:value="${p.discount}" />
                                                    </div>

                                                    <div class="mb-3"  id="singleStockContainer" th:if="${p.category != 'Clothing'}" >
                                                        <label class="form-label">Stock</label>
                                                        <input type="number" class="form-control" name="stock" th:value="${p.stock}" required/>
                                                    </div>

                                                    <div class="mb-3">
                                                        <label class="form-label">Status</label>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="radio" name="isActive" th:value="true"
                                                                   th:checked="${p.isActive}"/>
                                                            <label class="form-check-label">Active</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="radio" name="isActive" th:value="false"
                                                                   th:checked="${!p.isActive}"/>
                                                            <label class="form-check-label">Inactive</label>
                                                        </div>
                                                    </div>


                                                    <div class="mb-3">
                                                        <label class="form-label">Product Colors</label>
                                                        <div th:id="'colorsWrapper_' + ${p.id}" class="d-flex flex-wrap">
                                                            <div th:each="clr : ${T(com.ecommerce.util.Colors).values()}" class="form-check me-3 mb-2">
                                                                <!-- Checkbox for color selection -->
                                                                <input class="form-check-input" type="checkbox"
                                                                       th:id="'color-' + ${clr.name().toLowerCase()}"
                                                                       th:value="${clr.name()}"
                                                                       th:checked="${p.colorHexMap.containsKey(clr.name())}">
                                                                <!-- Hidden input for hex code -->
                                                                <input type="hidden" th:value="${clr.hexCode}">
                                                                <label th:for="'color-' + ${clr.name().toLowerCase()}"
                                                                       th:style="'background-color:' + ${clr.hexCode} + '; color:white; padding:2px 6px; border-radius:3px; border:1px solid #ccc; text-shadow:1px 1px 2px black;'">
                                                                    <span th:text="${clr.name()}"></span>
                                                                </label>
                                                            </div>
                                                        </div>
                                                        <small class="form-text text-muted">Select one or more colors for this product!!</small>
                                                    </div>



                                                    <div class="mb-3" th:if="${p.category == 'Clothing'}" th:id="'sizeContainer_' + ${p.id}">
                                                        <label class="form-label">Sizes & Stock</label>
                                                        <div th:each="sz : ${T(com.ecommerce.util.Sizes).values()}" class="mb-2 d-flex align-items-center">
                                                            <!-- Checkbox -->
                                                            <input type="checkbox"
                                                                   th:id="'size-' + ${sz.name()}"
                                                                   th:value="${sz.name()}"
                                                                   class="form-check-input me-2 sizeCheckbox"
                                                                   th:checked="${p.sizeStockMap[sz.name()] != null}" />

                                                            <label th:for="'size-' + ${sz.name()}" th:text="${sz.name()}" class="me-2"></label>

                                                            <!-- Stock input -->
                                                            <input type="number"
                                                                   min="0"
                                                                   placeholder="Stock"
                                                                   class="form-control w-25 sizeStockInput"
                                                                   th:value="${p.sizeStockMap[sz.name()] != null ? p.sizeStockMap[sz.name()] : 0}" />
                                                        </div>
                                                    </div>

                                                    <!-- Description -->
                                                    <div class="mb-3">
                                                        <label class="form-label">Description</label>
                                                        <textarea class="form-control" rows="4" placeholder="Enter product description" name="description" required
                                                                  th:text="${p.description}"></textarea>
                                                    </div>


                                                    <div class="mb-3">
                                                        <label class="form-label">Image</label>
                                                        <input type="file" name="file" class="form-control"/>
                                                        <div class="mt-2">
                                                            <img th:src="@{'/img/product_img/' + ${p.image}}" width="100" height="100" class="rounded"/>
                                                        </div>
                                                    </div>

                                                    <div class="text-center">
                                                        <button type="button" class="btn btn-warning px-4" th:onclick="'updateEditProductForm(' + ${p.id} + ')'">Update</button>
                                                    </div>
                                                </form>
                                            </div>
                                            <div class="modal-footer">
                                                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>



                            </tr>

                        </tbody>
                        </table>

                        <div class="text-center my-5" th:if="${#lists.isEmpty(products)}">
                            <div class="alert alert-info py-3" role="alert" style="border-radius: 0.5rem;">
                                <i class="fa-solid fa-box-open me-2"></i> No Products Available
                            </div>
                        </div>
                    </div>

                    <nav aria-label="Page navigation example" th:if="${!#lists.isEmpty(products)}">

                        <ul class="pagination">
                            <li class="page-item" th:classappend="${isFirst}?'disabled':''">
                                <a class="page-link" th:href="@{'/admin/products?pageNo='+${pageNo-1}}">Previous</a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                                class="page-item" th:classappend="${pageNo+1==i}?'active':''">
                                <a class="page-link" th:href="@{'/admin/products?pageNo='+${i-1}}"><span th:text="${i}"></span></a></li>
                            <li class="page-item" th:classappend="${isLast}?'disabled':''">
                                <a class="page-link" th:href="@{'/admin/products?pageNo='+${pageNo+1}}">Next</a>
                            </li>
                        </ul>
                    </nav>

                </div>



            </div>
        </div>
    </div>


</section>

</body>
</html>
