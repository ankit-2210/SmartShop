<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
</head>
<body>

<section>
    <div class="container-fluid mt-2">
        <div class="d-flex justify-content-center align-items-center" >
            <div class="col-md-12">
                <div class="card card-sh p-4">

                    <div class="position-relative mb-4 card-header">
                        <h3 class="text-center m-0">Orders</h3>
                    </div>

                    <form class="d-flex justify-content-between align-items-center">
                        <div class="row w-100">
                            <div class="col-4 ms-3">
                                <input type="text" class="form-control" placeholder="Search..." />
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-primary">Search</button>
                            </div>
                        </div>
                        <a th:href="@{'/admin/'}" class="btn btn-secondary me-4">Back</a>
                    </form>

                    <div th:if="${session.orderMessage}" class="container mt-2">
                        <div th:class="'alert alert-' + ${session.orderMessage.type} + ' alert-dismissible fade show text-center'"
                             role="alert" id="orderMessageAlert">
                            <p class="text-center" th:text="${session.orderMessage.content}"></p>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <!-- clear session after showing -->
                        <th:block th:text="${@sessionHelperImpl.removeSessionAttribute('orderMessage')}"></th:block>
                    </div>

                    <script>
                        setTimeout(function() {
                            let alertBox = document.getElementById("orderMessageAlert");
                            if (alertBox) {
                                alertBox.classList.remove("show");
                                setTimeout(() => alertBox.remove(), 500);
                             }
                        }, 5000);
                    </script>


                    <div class="card-body">
                        <table class="table">
                            <thead>
                            <tr>
                                <th class="text-center" scope="col">SL No.</th>
                                <th class="text-center" scope="col">Order Id</th>
                                <th class="text-center" scope="col">Date</th>
                                <th class="text-center" scope="col">Payment Status</th>
                                <th class="text-center" scope="col">Payment Type</th>
                                <th class="text-center" scope="col">Payment Id</th>
                                <th class="text-center" scope="col">Order Status</th>
                                <th class="text-center" scope="col">Amount</th>
                                <th class="text-center" scope="col">View</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="order, od : ${orders}">
                                <th class="text-center" scope="row" th:text="${od.count}"></th>
                                <td class="text-center" th:text="${order.orderId}"></td>
                                <td class="text-center" th:text="${order.orderDate != null ? #dates.format(order.orderDate, 'dd-MM-yyyy') : '-'}"></td>
                                <td class="text-center"
                                    th:text="${order.paymentStatus}"
                                    th:classappend="${order.paymentStatus == 'Paid'} ? 'text-success' : 'text-danger'">
                                </td>
                                <td class="text-center" th:text="${order.paymentType}"></td>
                                <td class="text-center" th:text="${order.paymentId}"></td>
                                <td class="text-center" th:text="${order.orderStatus}"></td>
                                <td class="text-center" th:text="'₹' + ${order.totalAmount}"></td>
                                <td class="text-center">
                                    <button class="btn btn-info btn-sm"
                                            data-bs-toggle="modal"
                                            th:attr="data-bs-target='#orderModal__' + ${order.id}">
                                        View
                                    </button>
                                </td>

                            </tr>
                            </tbody>
                        </table>

                        <div class="text-center my-5" th:if="${#lists.isEmpty(orders)}">
                            <div class="alert alert-info py-3" role="alert" style="border-radius: 0.5rem;">
                                <i class="fa-solid fa-receipt me-2"></i> No Orders Available
                            </div>
                        </div>


                    </div>


                    <nav aria-label="Page navigation example" th:if="${!#lists.isEmpty(orders)}">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${isFirst} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{'/admin/orders?pageNo=' + ${pageNo - 1}}">Previous</a>
                            </li>

                            <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                                class="page-item" th:classappend="${pageNo + 1 == i} ? 'active' : ''">
                                <a class="page-link" th:href="@{'/admin/orders?pageNo=' + ${i - 1}}">
                                    <span th:text="${i}"></span>
                                </a>
                            </li>

                            <li class="page-item" th:classappend="${isLast} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{'/admin/orders?pageNo=' + ${pageNo + 1}}">Next</a>
                            </li>
                        </ul>
                    </nav>


                </div>


            </div>
        </div>
    </div>

    <!-- ✅ Put all modals here (after the table) -->
    <div th:each="order : ${orders}">
        <div class="modal fade" th:id="'orderModal__' + ${order.id}" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Order Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Order ID:</strong> <span th:text="${order.orderId}"></span></p>
                        <p><strong>Date:</strong> <span th:text="${#dates.format(order.orderDate,'dd-MM-yyyy')}"></span></p>
                        <p><strong>Order Status:</strong> <span th:text="${order.orderStatus}"></span></p>

                        <h6>Products</h6>
                        <table class="table table-bordered">
                            <thead>
                            <tr>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${order.items}">
                                <td th:text="${item.product.name}"></td>
                                <td th:text="${item.quantity}"></td>
                                <td th:text="${item.price}"></td>
                                <td th:text="${item.price * item.quantity}"></td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- Update Order Status Form -->
                        <form th:id="'updateForm_' + ${order.id}" th:action="@{/admin/updateOrder}" method="post" class="mt-3" enctype="multipart/form-data">
                            <input type="hidden" name="orderId" th:id="'orderId_' + ${order.id}" th:value="${order.id}"/>
                            <div class="row">
                                <div class="col-8">
                                    <select th:id="'orderStatus_' + ${order.id}" name="orderStatus" class="form-select" required>
                                        <option th:selected="${order.orderStatus == 'In Progress'}">In Progress</option>
                                        <option th:selected="${order.orderStatus == 'Received'}">Received</option>
                                        <option th:selected="${order.orderStatus == 'Packed'}">Packed</option>
                                        <option th:selected="${order.orderStatus == 'Out for Delivery'}">Out for Delivery</option>
                                        <option th:selected="${order.orderStatus == 'Delivered'}">Delivered</option>
                                        <option th:selected="${order.orderStatus == 'Cancelled'}">Cancelled</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <button type="button"
                                            class="btn btn-primary w-100 update-btn"
                                            th:data-order-id="${order.id}"
                                            th:disabled="${order.orderStatus == 'Delivered' or order.orderStatus == 'Cancelled'}">
                                        Update
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>



</section>

</body>
</html>
