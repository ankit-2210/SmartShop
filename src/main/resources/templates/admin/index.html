<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>${title}</title>

</head>
<body>

    <section>
        <section class="text-gray-600 body-font">
            <div class="container px-5 py-24 mx-auto">
                <div class="flex flex-wrap w-full mb-20 flex-col items-center text-center">
                    <h1 class="sm:text-3xl text-2xl font-medium title-font mb-2 text-gray-900">Admin Dashboard</h1>
                    <p class="lg:w-1/2 w-full leading-relaxed text-gray-500">Whatever cardigan tote bag tumblr hexagon brooklyn asymmetrical gentrify, subway tile poke farm-to-table.</p>
                </div>
                <div class="flex flex-wrap -m-4">
                    <div class="xl:w-1/3 md:w-1/2 p-4">
                        <a th:href="@{/admin/addproduct}" class="text-decoration-none">
                            <div class="card card-sh">
                                <div class="card-body text-center text-primary">
                                    <i class="fa-solid fa-square-plus fa-3x"></i>
                                    <h4> Add Product </h4>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="xl:w-1/3 md:w-1/2 p-4">
                            <a th:href="@{/admin/category}" class="text-decoration-none">
                                <div class="card card-sh">
                                    <div class="card-body text-center text-warning">
                                        <i class="fa-solid fa-list fa-3x"></i>
                                        <h4> Add Category </h4>
                                    </div>
                                </div>
                            </a>

                    </div>
                    <div class="xl:w-1/3 md:w-1/2 p-4">
                        <a th:href="@{/admin/products}" class="text-decoration-none">
                            <div class="card card-sh">
                                <div class="card-body text-center text-success">
                                    <i class="fa-solid fa-table-list fa-3x"></i>
                                    <h4> View Product </h4>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="xl:w-1/3 md:w-1/2 p-4">
                        <a th:href="@{/admin/orders}" class="text-decoration-none">
                            <div class="card card-sh">
                                <div class="card-body text-center text-warning">
                                    <i class="fa-solid fa-box-open fa-3x"></i>
                                    <h4> Orders </h4>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="xl:w-1/3 md:w-1/2 p-4">
                        <a th:href="@{/admin/users}" class="text-decoration-none">
                            <div class="card card-sh">
                                <div class="card-body text-center text-primary">
                                    <i class="fa-solid fa-circle-user fa-3x"></i>
                                    <h4> Users </h4>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="xl:w-1/3 md:w-1/2 p-4">
                        <a th:href="@{/admin/colors}" class="text-decoration-none">
                            <div class="card card-sh">
                                <div class="card-body text-center text-danger">
                                    <i class="fa-solid fa-palette fa-3x"></i>
                                    <h4> Add Colors </h4>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="xl:w-1/3 md:w-1/2 p-4">
                        <a href="" class="text-decoration-none">
                            <div class="card card-sh">
                                <div class="card-body text-center text-error">
                                    <i class="fa-solid fa-user-plus fa-3x"></i>
                                    <h4> Add Admin </h4>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

            </div>
        </section>


    </section>

</body>
</html>
